name: Validação estática WMK
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar projeto
        run: python3 scripts/check_project.py
      - name: Testar colisões, IA, mapas, missões e cenários
        run: node --test tests/*.test.mjs
      - name: Empacotar ZIP completo de testes WMK
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          zip -q -r dist/WMK-Combined-Arms-Game-v0.2.1-Lab-v0.3.8.zip . -x '.git/*' 'dist/*' '.github/*'
          unzip -tq dist/WMK-Combined-Arms-Game-v0.2.1-Lab-v0.3.8.zip
      - name: Publicar ZIP nos artefatos da execução
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: WMK-Combined-Arms-Game-v0.2.1-Lab-v0.3.8-ZIP
          path: dist/WMK-Combined-Arms-Game-v0.2.1-Lab-v0.3.8.zip
          retention-days: 30
          if-no-files-found: error
